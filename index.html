<style>

<script>
'use strict';
/* =====================================================================

const TURN_GAIN = 5;          // how fast heading chases finger angle (higher = snappier/twitchier)

const INVERT_STEER = false;   // false: finger pushes car AWAY (finger left of rear -> car goes right). true flips.

const OFFROAD_DRAG = 1.5;     // extra slowdown off road
const OFFROAD_GRIP_MULT = 0.6;

// Track & difficulty
const ROAD_W_START = 110, ROAD_W_END = 80, WIDEN_MAX = 40; // narrow on straights; widens on the OUTSIDE of turns by up to WIDEN_MAX (right turn -> widens left)
const DIFF_DIST = 30000;      // distance (units) to reach full difficulty
const CHUNK = 260;            // obstacle chunk length
// Damage

// View
const VIEW_W = 230;           // world units visible across (phone portrait)
const SPEED_ZOOM_OUT = 0.1;  // camera pulls back at speed
const CAMERA_PITCH_DEG = 35;  // camera angle above horizontal (90 = pure top-down)

/* ---------- SETUP ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, zoom = 1, baseZoom = 1;
function resize() {

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- INPUT (first finger only; mouse for desktop) ---------- */
const input = { down: false, x: 0, y: 0, id: null };
function setP(p) { const r = cv.getBoundingClientRect(); input.x = p.clientX - r.left; input.y = p.clientY - r.top; }
cv.addEventListener('touchstart', e => {
  e.preventDefault();

  e.preventDefault();

window.addEventListener('mouseup', () => { input.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- TRACK GENERATION (endless, deterministic function of distance t) ---------- */

    let ang = 0, R = 200, len = 0, hp = false, sharp = false;

    else if (T.hp) { ang = T.hs * (Math.PI - HAIRPIN_DEG * Math.PI / 180); R = 300; } // straighten out so the legs of a hairpin stay parallel

/* ---------- GAME STATE ---------- */

function reset() {
  car = { x: 0, y: 0, h: 0, vx: 0, vy: 0, slip: 0, off: false, si: 0, vl: 0 };
  cam = { x: 0, y: 0 }; damage = 0; shake = 0; hitCd = 0; dist = 0; particles = []; chunks.clear(); skids = []; lastSk = [null, null]; initTrack(); camA = 0;
}

function onTap() {
  if (state === 'start') { reset(); state = 'play'; }
  else if (state === 'over' && now - overAt > 600) { reset(); state = 'play'; }
}
function gameOver() {
  state = 'over'; overAt = now;

/* ---------- CAR PHYSICS ---------- */

    if (fd > STEER_DEADZONE) {

function update(dt) {

/* ---------- ART STYLE (Art of Rally-ish): flat-shaded low-poly meshes, biome palettes, skid marks ----------
